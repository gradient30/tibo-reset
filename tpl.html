<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>

}

  --bg:#e8eef8;--fg:#12182a;--mut:#5a6578;--glass:rgba(255,255,255,.78);--bd:rgba(40,60,120,.12);
  --acc:#4f6ef7;--acc2:#0891b2;--ok:#059669;--warn:#d97706;--danger:#e11d48;

}}
*{box-sizing:border-box}html,body{margin:0}
body{font:13px/1.55 "SF Pro Text",-apple-system,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;color:var(--fg);background:var(--bg);min-height:100vh;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;z-index:-2;background:
  radial-gradient(50% 40% at 12% 0%,color-mix(in srgb,var(--acc) 28%,transparent),transparent 70%),
  radial-gradient(40% 35% at 95% 8%,color-mix(in srgb,var(--acc2) 20%,transparent),transparent 65%),
  radial-gradient(45% 40% at 70% 100%,color-mix(in srgb,var(--ok) 10%,transparent),transparent 70%),

body:after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.55;background-image:

  repeating-linear-gradient(0deg,transparent,transparent 3px,var(--scan) 3px,var(--scan) 4px);
  background-size:48px 48px,48px 48px,100% 8px}
.w{max-width:1280px;margin:auto;padding:18px 18px 36px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:12px}
.brand .mark{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;font-size:18px;box-shadow:0 0 24px color-mix(in srgb,var(--acc) 45%,transparent)}
h1{font-size:20px;margin:0;letter-spacing:.04em;font-weight:700}h1 b{background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub,.q{color:var(--mut)}.q{font-size:11.5px}
.live{display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border-radius:8px;border:1px solid var(--bd);background:var(--glass);font-size:11px;letter-spacing:.04em;backdrop-filter:blur(12px)}
.live .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok);animation:pulse 2s ease infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
h2{font-size:12px;margin:0 0 10px;display:flex;gap:8px;align-items:center;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);font-weight:600}
h2 .tag{text-transform:none;letter-spacing:0}
.bento{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}
.c{position:relative;grid-column:span 12;background:var(--glass);border:1px solid var(--bd);border-radius:14px;padding:14px 16px;backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);box-shadow:var(--sh);transform:perspective(900px) rotateX(var(--rx,0)) rotateY(var(--ry,0)) translate(var(--tx,0),var(--ty,0));transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s;overflow:hidden;min-width:0}
.c:before{content:"";position:absolute;top:0;left:12px;right:12px;height:1px;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--acc2) 55%,transparent),transparent);opacity:.7;pointer-events:none}
.c:after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .25s;background:radial-gradient(280px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--acc) 18%,transparent),transparent 60%)}
.c:hover:after{opacity:1}.c:hover{box-shadow:var(--sh),0 0 0 1px color-mix(in srgb,var(--acc) 35%,transparent),0 0 36px color-mix(in srgb,var(--acc) 14%,transparent)}
.s8{grid-column:span 8}.s4{grid-column:span 4}.s3{grid-column:span 3}.s6{grid-column:span 6}.s2{grid-column:span 2}
@media(max-width:960px){.s8,.s4,.s6{grid-column:span 12}.s3,.s2{grid-column:span 6}}
@media(max-width:520px){.s3,.s2{grid-column:span 12}.w{padding:12px 10px 88px}h1{font-size:17px}}
.kpi{padding:12px 14px}.kpi .k{margin-bottom:4px}.kpi .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi .spark{margin-top:6px;opacity:.9}
.hero-done{background:linear-gradient(145deg,color-mix(in srgb,var(--ok) 14%,var(--glass)),color-mix(in srgb,var(--acc) 6%,var(--glass)));padding:16px 18px}
.hero-next{background:linear-gradient(145deg,color-mix(in srgb,var(--warn) 14%,var(--glass)),color-mix(in srgb,var(--acc2) 8%,var(--glass)));padding:16px 18px}
.hero-pair{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.hero-pair .meta{flex:1;min-width:140px}
.big{font-size:clamp(22px,3.2vw,32px);font-weight:800;letter-spacing:-.03em;line-height:1.15;margin:6px 0 4px;font-variant-numeric:tabular-nums}
.grad{background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}

.v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700;background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);letter-spacing:.02em}
.tag.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 30%,transparent)}
.tag.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.tag.acc{background:color-mix(in srgb,var(--acc) 16%,transparent);color:var(--acc);border-color:color-mix(in srgb,var(--acc) 30%,transparent)}
.bar{height:6px;border-radius:4px;background:color-mix(in srgb,var(--fg) 8%,transparent);overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:4px}
a{color:var(--acc2);text-decoration:none}a:hover{text-decoration:underline}
.u{color:var(--mut);font-style:italic;opacity:.85}
.tl{max-height:640px;overflow:auto;margin:0 -4px;padding:0 4px}
.ev{display:grid;grid-template-columns:140px 1fr 1fr 100px;gap:10px;padding:10px;border-radius:10px;border:1px solid var(--bd);margin-bottom:6px;background:color-mix(in srgb,var(--glass) 60%,transparent)}
.ev.ch{border-color:color-mix(in srgb,var(--ok) 35%,transparent)}
@media(max-width:760px){.ev{grid-template-columns:1fr 1fr}.ev>.d{grid-column:span 2}}
.ev .t{font-weight:700}.lab{font-size:10px;color:var(--mut);letter-spacing:.06em;text-transform:uppercase}
.chip{display:inline-block;font-size:10px;padding:0 6px;border-radius:4px;background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok);margin-left:4px;font-weight:600}
svg text{fill:var(--mut);font-size:10px}ul{margin:4px 0;padding-left:16px}li{margin:3px 0}
.bk{display:flex;flex-direction:column;gap:6px;max-height:340px;overflow:auto}.bk div{font-size:12px;padding:8px 10px;border-radius:8px;border:1px solid var(--bd)}
.flt{display:flex;gap:6px;flex-wrap:wrap}.flt button{font:inherit;font-size:11px;padding:4px 12px;border-radius:6px;border:1px solid var(--bd);background:var(--glass);color:var(--fg);cursor:pointer}.flt button.on{background:var(--acc);color:#fff;border-color:transparent}
.nav{position:sticky;top:8px;z-index:50;display:flex;gap:4px;padding:5px;margin:0 0 14px;border-radius:10px;background:var(--glass);border:1px solid var(--bd);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);box-shadow:var(--sh);overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{flex:0 0 auto;padding:7px 14px;border-radius:7px;color:var(--mut);font-weight:600;font-size:12px;text-decoration:none;transition:background .2s,color .2s;letter-spacing:.02em}
.nav a:hover{background:color-mix(in srgb,var(--acc) 12%,transparent);color:var(--fg);text-decoration:none}
.nav a.on{background:linear-gradient(90deg,var(--acc),var(--acc2));color:#fff;box-shadow:0 0 20px color-mix(in srgb,var(--acc) 40%,transparent)}
@media(max-width:600px){.nav{position:fixed;top:auto;bottom:8px;left:8px;right:8px;margin:0;border-radius:12px}}
[data-tab]{display:none}[data-tab].show{display:block;animation:tin .28s ease both}.bento>[data-tab].show{display:block}
@keyframes tin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.more{display:inline-block;margin-top:8px;font-size:11px;font-weight:600}
.foot{margin-top:14px;text-align:center;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--glass);backdrop-filter:blur(12px)}
.ring{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.miss{color:var(--danger);font-weight:700}
.banner{grid-column:span 12;padding:8px 14px;border-radius:8px;border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);background:color-mix(in srgb,var(--warn) 8%,var(--glass));font-size:12px;display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.banner .tag{flex:0 0 auto}
.ov-foot{grid-column:span 12;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;padding:10px 14px;border-radius:10px;border:1px solid var(--bd);background:var(--glass);font-size:11px;color:var(--mut)}
.cmp-wrap{overflow:auto;margin:0 -4px;padding:0 4px}
table.cmp{width:100%;border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums;font-size:12px}
table.cmp th{text-align:left;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--bd);white-space:nowrap;position:sticky;top:0;background:var(--glass);backdrop-filter:blur(8px)}
table.cmp td{padding:9px 10px;border-bottom:1px solid color-mix(in srgb,var(--bd) 70%,transparent);vertical-align:middle;white-space:nowrap}
table.cmp tr.hi{background:color-mix(in srgb,var(--ok) 7%,transparent)}
table.cmp tr.hi td:first-child{box-shadow:inset 3px 0 0 var(--ok)}
table.cmp tr:hover td{background:color-mix(in srgb,var(--acc) 6%,transparent)}
table.cmp .num{font-weight:700}
.tod{display:inline-flex;align-items:center;gap:5px}
.tod i{width:7px;height:7px;border-radius:50%;display:inline-block}
.tod.night i{background:var(--acc)}.tod.dawn i{background:var(--warn)}.tod.am i{background:var(--ok)}.tod.pm i{background:var(--acc2)}.tod.eve i{background:var(--danger)}
.cdown{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:4px}
details.fold{margin-top:6px}details.fold summary{cursor:pointer;color:var(--mut);font-size:11px;font-weight:600;list-style:none}details.fold summary::-webkit-details-marker{display:none}details.fold summary:before{content:"▸ ";color:var(--acc2)}details.fold[open] summary:before{content:"▾ "}
@media(prefers-reduced-motion:reduce){[data-tab].show{animation:none}.c{transition:none!important;transform:none!important}.c:after{display:none}.live .dot{animation:none}}
</style></head><body><div class="w">
<div class="top">
  <div class="brand"><div class="mark">↻</div><div><h1><b>TIBO RESET</b> 数据台</h1><div class="sub">Codex / ChatGPT Work 全局额度重置 · @thsottiaux · 北京时间 UTC+8</div></div></div>
  <span class="live"><span class="dot"></span>BOARD · 生成于 <span id="gen"></span></span>
</div>
<nav class="nav" aria-label="分类"><a href="#overview">概览</a><a href="#trend">趋势</a><a href="#history">历史记录</a><a href="#other">其他</a></nav>
<main class="bento">
 <!-- KPI strip -->
 <div data-tab="overview" class="s3 c mag kpi" id="k1"></div>
 <div data-tab="overview" class="s3 c mag kpi" id="k2"></div>
 <div data-tab="overview" class="s3 c mag kpi" id="k3"></div>
 <div data-tab="overview" class="s3 c mag kpi" id="k4"></div>
 <!-- Dual hero: last done vs next preview -->
 <section data-tab="overview" class="c hero-done s6 mag" id="heroDone"></section>
 <section data-tab="overview" class="c hero-next s6 mag" id="heroNext"></section>
 <!-- Timeline -->
 <section data-tab="overview" class="c s8 mag" id="strip"></section>
 <section data-tab="overview" class="c s4 mag" id="sparkcard"></section>
 <!-- Comparison table -->
 <section data-tab="overview" class="c mag" id="cmp"></section>
 <!-- Compact secondary -->
 <section data-tab="overview" class="c s4 mag" id="lag"></section>
 <section data-tab="overview" class="c s4 mag" id="check"></section>
 <section data-tab="overview" class="c s4 mag" id="flow"></section>
 <div data-tab="overview" class="banner" id="note"></div>
 <div data-tab="overview" class="ov-foot" id="ovfoot"></div>
 <!-- Other tabs -->
 <section data-tab="trend" class="c mag s8"><h2>间隔走势（天） <span class="tag ok">节奏</span></h2><div id="chartGap"></div><div class="q">折线 = 与上一次全局重置的间隔；超过 20 天截断显示；虚线 = 近 30 天 / 全史中位；<span style="color:var(--ok)">绿点</span> = 28 天挑战期内。概览火花线只看近 20 次，这里看全史节奏。</div></section>
 <section data-tab="trend" class="c mag s4"><h2>落地时段 · 北京时间</h2><div id="chartHour"></div><div class="q">柱高 = 该小时落地次数；<span style="color:var(--ok)">绿</span> = 挑战期子集叠在全史上。用于看「通常几点到账」。</div></section>
 <section data-tab="trend" class="c mag"><h2>节奏摘要</h2><div id="trendSum" class="q"></div></section>
 <section data-tab="history" class="c"><h2>历史记录 <span class="q" id="cnt"></span></h2>
  <div class="flt" style="margin-bottom:10px"><button class="on" data-f="all">全部</button><button data-f="ch">有预告帖</button><button data-f="win">有官方窗口</button></div>
  <div class="tl" id="tb"></div></section>
 <section data-tab="other" class="c s6 mag"><h2>Banked reset 记录 <span class="q">（不计入间隔）</span></h2><div class="bk" id="bk"></div></section>
 <section data-tab="other" class="c s6 mag"><h2>数据缺口</h2><ul id="gaps"></ul></section>
 <section data-tab="other" class="c mag" id="basis"></section>
 <section data-tab="other" class="c mag" id="nr"></section>
 <section data-tab="other" class="c q mag" id="ft"></section>
</main><footer class="foot q" id="sf"></footer></div>
<script>
const D=__DATA__;const $=s=>document.querySelector(s);const U='<span class="u">unknown</span>';const L=D.last_reset,F=D.forecast,S=D.stats_30d,A=D.stats_all;
const lk=(u,t)=>`<a href="${u}" target="_blank" rel="noopener">${t}</a>`;
$('#gen').textContent=D.generated_at_bj;
const NOWT=Date.now(),PT=t=>new Date(t).getTime(),BJT=b=>PT(b.replace(' ','T')+':00+08:00'),last=PT(L.actual_utc),el=(NOWT-last)/864e5,pct=Math.min(1,el/S.median);
function sparkSVG(h=32){const g=D.events.filter(r=>r.gap_days!=null).slice(-20).map(r=>Math.min(r.gap_days,20)),W=220,H=h,m=Math.max(...g,1);
 return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${h}" preserveAspectRatio="none" aria-label="近20次间隔"><defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--acc2)" stop-opacity=".35"/><stop offset="1" stop-color="var(--acc2)" stop-opacity="0"/></linearGradient></defs>
 <polygon fill="url(#sg)" points="0,${H} ${g.map((v,i)=>`${i/(g.length-1)*W},${H-2-v/m*(H-4)}`).join(' ')} ${W},${H}"/>
 <polyline fill="none" stroke="var(--acc2)" stroke-width="1.8" vector-effect="non-scaling-stroke" points="${g.map((v,i)=>`${i/(g.length-1)*W},${H-2-v/m*(H-4)}`).join(' ')}"/></svg>`}
function ringSVG(pctVal,labelTop,labelBot,color='ok',size=110){
  const R=42,C=2*Math.PI*R,p=Math.max(0,Math.min(1,pctVal)),gid='rg'+Math.random().toString(36).slice(2,6);
  const stroke=color==='ok'?'var(--ok)':color==='warn'?'var(--warn)':'var(--acc2)';
  return `<svg width="${size}" height="${size}" viewBox="0 0 110 110" role="img" aria-label="${labelTop}" style="flex:0 0 auto"><defs><linearGradient id="${gid}" x1="0" x2="1"><stop offset="0" stop-color="${stroke}"/><stop offset="1" stop-color="var(--acc2)"/></linearGradient></defs>
  <circle cx="55" cy="55" r="${R}" fill="none" stroke="currentColor" opacity=".12" stroke-width="8"/>
  <circle cx="55" cy="55" r="${R}" fill="none" stroke="url(#${gid})" stroke-width="8" stroke-linecap="round" stroke-dasharray="${C*p} ${C}" transform="rotate(-90 55 55)" style="filter:drop-shadow(0 0 6px color-mix(in srgb,${stroke} 50%,transparent))"/>
  <text x="55" y="52" text-anchor="middle" style="font-size:18px;font-weight:800;fill:var(--fg)">${labelTop}</text>
  <text x="55" y="68" text-anchor="middle" style="font-size:9px">${labelBot}</text></svg>`;
}
function todBucket(bj){const h=parseInt((bj||'').slice(11,13),10);if(isNaN(h))return {cls:'',lab:'—'};
  if(h<5)return{cls:'night',lab:'深夜'};if(h<9)return{cls:'dawn',lab:'清晨'};if(h<12)return{cls:'am',lab:'上午'};if(h<18)return{cls:'pm',lab:'下午'};return{cls:'eve',lab:'晚上'}}
function srcOf(r){if(r.confirmation)return{t:'官方',c:'ok'};if(r.user_confirm)return{t:'用户确认',c:'warn'};return{t:'Radar',c:'acc'}}
const Pend=D.pending,isOff=F.kind==='official';
const winEnd=BJT(F.window_end_bj),winState=(()=>{if(isOff){if(NOWT<winEnd)return '官方预告中';return '窗口已过·未核实'}const a=BJT(F.window_start_bj);if(NOWT<a)return '未开始';if(NOWT<=winEnd)return '进行中';return '已过期'})();
const remainMs=Math.max(0,winEnd-NOWT),remainH=(remainMs/36e5),remainLabel=remainMs<=0?'窗口已过':remainH>=24?`${(remainH/24).toFixed(1)} 天`:`${remainH.toFixed(1)} 小时`;
const winPct=isOff?Math.max(0.05,Math.min(0.95,1-remainMs/Math.max(1,(winEnd-PT(Pend&&Pend.teaser&&Pend.teaser.time_utc||L.actual_utc))))):pct;
// KPI strip — concise
[['距上次',el.toFixed(1)+' 天',`${L.label||''} · ${L.actual_bj.slice(5,10)}`],
 ['30天中位',S.median+' 天',`均值 ${S.mean} · n=${S.n}`],
 ['已完成',D.events.length+' 次',`banked ${D.banked.length} · 预告不计`],
 ['下一次',isOff?(Pend?Pend.label:'官方'):'估计',isOff?`${F.window_end_bj.slice(5)} 前`:`→ ${F.window_end_bj.slice(5)}`]]
.forEach(([k,v,s],i)=>$('#k'+(i+1)).innerHTML=`<div class="k">${k}</div><div class="v">${v}</div><div class="q">${s}</div>${i==1?`<div class="spark">${sparkSVG(28)}</div>`:''}${i==3?`<div style="margin-top:4px"><span class="tag ${isOff?'warn':''}">${isOff?'预测 · 未落地':'估计'}</span></div>`:''}`);

// Dual hero
$('#heroDone').innerHTML=`<div class="hero-pair">
${ringSVG(1,'✓','已重置','ok',118)}
<div class="meta">
  <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><div class="k">最近重置</div><span class="tag ok">已重置 · #${D.events.length}</span></div>
  <div class="big grad-ok">${(L.label||'—').replace('（社区投票）','')}</div>
  <div class="v" style="font-size:18px">${L.actual_bj}</div>
  <div class="q" style="margin-top:4px">北京时间 · 间隔 ${L.gap_days!=null?L.gap_days+' 天':'—'}${L.user_confirm?' · 用户确认 '+L.user_confirm.time_bj.slice(11):''}${L.confirmation?' · '+lk(L.confirmation.url,'官宣'):''} · ${lk(L.radar_url,'Radar')}</div>
