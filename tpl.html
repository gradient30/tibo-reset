.ring{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.miss{color:var(--danger);font-weight:700}
.banner{grid-column:span 12;padding:8px 14px;border-radius:8px;border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);background:color-mix(in srgb,var(--warn) 8%,var(--glass));font-size:12px;display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}

.ov-foot{grid-column:span 12;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;padding:10px 14px;border-radius:10px;border:1px solid var(--bd);background:var(--glass);font-size:11px;color:var(--mut)}
.stage-row{display:contents}
@media(prefers-reduced-motion:reduce){[data-tab].show{animation:none}.c{transition:none!important;transform:none!important}.c:after{display:none}.live .dot{animation:none}}
</style></head><body><div class="w">
<div class="top">
  <div class="brand"><div class="mark">↻</div><div><h1><b>TIBO RESET</b> 数据台</h1><div class="sub">Codex / ChatGPT Work 全局额度重置 · @thsottiaux · 北京时间 UTC+8</div></div></div>
  <span class="live"><span class="dot"></span>BOARD · 生成于 <span id="gen"></span></span>
</div>
<nav class="nav" aria-label="分类"><a href="#overview">概览</a><a href="#trend">趋势</a><a href="#history">历史记录</a><a href="#other">其他</a></nav>
<main class="bento">
 <!-- KPI strip -->
 <div data-tab="overview" class="s3 c mag kpi" id="k1"></div>
 <div data-tab="overview" class="s3 c mag kpi" id="k2"></div>
 <div data-tab="overview" class="s3 c mag kpi" id="k3"></div>
 <div data-tab="overview" class="s3 c mag kpi" id="k4"></div>
 <!-- Main stage -->
 <section data-tab="overview" class="c hero s8 mag" id="hero"></section>
 <section data-tab="overview" class="c s4 mag" id="status"></section>

 <!-- Secondary -->
 <section data-tab="overview" class="c mag" id="flow"></section>
 <section data-tab="overview" class="c s4 mag" id="lag"></section>
 <section data-tab="overview" class="c s4 mag" id="sparkcard"></section>

 <div data-tab="overview" class="banner" id="note"></div>
 <div data-tab="overview" class="ov-foot" id="ovfoot"></div>
 <!-- Other tabs -->
 <section data-tab="trend" class="c mag"><h2>重置间隔趋势（天）</h2><div id="chart"></div><div class="q">柱 = 与上一次全局重置的间隔（近 40 次）；虚线 = 近 30 天中位数；<span style="color:var(--ok)">绿色</span> = 28 天挑战期内；超过 20 天的柱被截断。banked reset 不计入。</div></section>
 <section data-tab="history" class="c"><h2>历史记录 <span class="q" id="cnt"></span></h2>
  <div class="flt" style="margin-bottom:10px"><button class="on" data-f="all">全部</button><button data-f="ch">有预告帖</button><button data-f="win">有官方窗口</button></div>
  <div class="tl" id="tb"></div></section>
 <section data-tab="other" class="c s6 mag"><h2>Banked reset 记录 <span class="q">（不计入间隔）</span></h2><div class="bk" id="bk"></div></section>
 <section data-tab="other" class="c s6 mag"><h2>数据缺口</h2><ul id="gaps"></ul></section>
 <section data-tab="other" class="c mag" id="nr"></section>
 <section data-tab="other" class="c q mag" id="ft"></section>
</main><footer class="foot q" id="sf"></footer></div>
<script>
const D=__DATA__;const $=s=>document.querySelector(s);const U='<span class="u">unknown</span>';const L=D.last_reset,F=D.forecast,S=D.stats_30d,A=D.stats_all;
const lk=(u,t)=>`<a href="${u}" target="_blank" rel="noopener">${t}</a>`;
$('#gen').textContent=D.generated_at_bj;
const NOWT=Date.now(),PT=t=>new Date(t).getTime(),BJT=b=>PT(b.replace(' ','T')+':00+08:00'),last=PT(L.actual_utc),el=(NOWT-last)/864e5,pct=Math.min(1,el/S.median);
function sparkSVG(h=32){const g=D.events.filter(r=>r.gap_days!=null).slice(-20).map(r=>Math.min(r.gap_days,20)),W=220,H=h,m=Math.max(...g,1);
 return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${h}" preserveAspectRatio="none" aria-label="近20次间隔"><defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--acc2)" stop-opacity=".35"/><stop offset="1" stop-color="var(--acc2)" stop-opacity="0"/></linearGradient></defs>
 <polygon fill="url(#sg)" points="0,${H} ${g.map((v,i)=>`${i/(g.length-1)*W},${H-2-v/m*(H-4)}`).join(' ')} ${W},${H}"/>
 <polyline fill="none" stroke="var(--acc2)" stroke-width="1.8" vector-effect="non-scaling-stroke" points="${g.map((v,i)=>`${i/(g.length-1)*W},${H-2-v/m*(H-4)}`).join(' ')}"/></svg>`}
// KPI strip
const Pend=D.pending,isOff=F.kind==='official';
const winEnd=BJT(F.window_end_bj),winState=(()=>{if(isOff){if(NOWT<winEnd)return '官方预告中';return '窗口已过·未核实'}const a=BJT(F.window_start_bj);if(NOWT<a)return '未开始';if(NOWT<=winEnd)return '进行中';return '已过期'})();
[['距上次重置',el.toFixed(1)+' 天',`最近已完成 ${L.label||''} · ${L.actual_bj}`],
 ['30天中位间隔',S.median+' 天',`均值 ${S.mean} · n=${S.n}`],
 ['全局重置次数',D.events.length+' 次',`已完成 · banked ${D.banked.length} · 待落地不计`],
 ['下次窗口状态',winState,isOff?`官方 · ${F.window_end_bj} 前（PDT）`:`${F.window_start_bj.slice(5)} → ${F.window_end_bj.slice(5)}`]]
.forEach(([k,v,s],i)=>$('#k'+(i+1)).innerHTML=`<div class="k">${k}</div><div class="v">${v}</div><div class="q">${s}</div>${i==1?`<div class="spark">${sparkSVG(28)}</div>`:''}${i==3?`<div class="q" style="margin-top:4px"><span class="tag">${isOff?'官方预告 · 信心 '+F.confidence:'估计，非官方'}</span></div>`:''}`);
// Hero + ring
const R=52,C=2*Math.PI*R;
$('#hero').innerHTML=`<div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center"><div class="k">${isOff?'下次全局重置 · 官方预告窗口':'下次全局重置 · 预测窗口'}</div><span class="tag">${isOff?'官方 · 信心 '+F.confidence:'估计，非官方 · 信心 '+F.confidence}</span></div>
<div class="big grad">${isOff?`北京时间 ${F.window_end_bj} 前<br><span style="font-size:.55em;opacity:.85">（PDT · 主读）</span>`:`${F.window_start_bj}<br>→ ${F.window_end_bj}`}</div>
${isOff&&Pend?`<div class="q"><b>${Pend.label}</b> · ${lk(Pend.teaser.url,'预告帖 '+Pend.teaser.time_bj)} · ${lk(Pend.reply.url,'时点回复')}</div>
<div class="q">“${Pend.teaser.quote}”</div><div class="q">→ “${Pend.reply.quote}”</div>
<div class="q" style="margin-top:4px">${F.hour_note}${F.window_end_bj_alt?` · 字面 PST 备选：${F.window_end_bj_alt} 前`:''}</div>
<div class="q" style="margin-top:4px"><span class="tag">未落地</span> 最近已完成仍为 ${L.label} ${L.actual_bj} · 不计入第 ${D.events.length+1} 次直至确认</div>`:`<div class="q">${F.hour_note}</div>`}
<div class="q" style="margin-top:6px">⚡ 改判条件：${F.change}</div>
<a class="more" href="#overview" onclick="event.preventDefault();document.getElementById('basis').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})">预测依据 ↓</a> · <a class="more" href="#trend">趋势 →</a>`;
$('#status').innerHTML=`<div class="k">当前状态 · 实时环</div><div class="ring" style="margin-top:8px"><svg width="130" height="130" viewBox="0 0 130 130" role="img" aria-label="已过时间 / 中位间隔" style="flex:0 0 auto"><defs><linearGradient id="rg" x1="0" x2="1"><stop offset="0" stop-color="var(--acc)"/><stop offset="1" stop-color="var(--acc2)"/></linearGradient></defs>
<circle cx="65" cy="65" r="${R}" fill="none" stroke="currentColor" opacity=".12" stroke-width="9"/>
<circle cx="65" cy="65" r="${R}" fill="none" stroke="url(#rg)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${C*pct} ${C}" transform="rotate(-90 65 65)" style="filter:drop-shadow(0 0 6px color-mix(in srgb,var(--acc2) 50%,transparent))"/>
<text x="65" y="60" text-anchor="middle" style="font-size:22px;font-weight:800;fill:var(--fg)">${el.toFixed(1)}</text>
<text x="65" y="78" text-anchor="middle">/ ${S.median}d</text></svg>
<div><div class="q">最近全局重置</div><div class="v" style="font-size:18px">${L.actual_bj}</div><div class="q">${L.label||''} · ${L.confirmation?lk(L.confirmation.url,'官宣帖'):''} · ${lk(L.radar_url,'Radar')}</div><div class="q" style="margin-top:4px">${L.actual_basis}</div><div class="q" style="margin-top:6px">环 = 已过 / 30天中位；超中位 ≠ 马上到期</div></div></div>`;
// Timeline
{const ch=D.events.filter(r=>PT(r.actual_utc)>Date.now()-16*864e5);
const F1=BJT(F.window_end_bj),F0=isOff&&Pend?PT(Pend.teaser.time_utc):BJT(F.window_start_bj);
const C0=BJT(D.forecast_check.window_start_bj),C1=BJT(D.forecast_check.window_end_bj);
const t0=PT(ch[0].actual_utc)-864e5/2,t1=Math.max(F1,NOWT)+864e5/2,W=760,H=118,x=t=>20+(t-t0)/(t1-t0)*(W-40);
let g=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="近期重置时间轴">`;
for(let d=BJT(new Date(t0+8*36e5).toISOString().slice(0,10)+' 00:00')+864e5,k=0;d<t1;d+=864e5,k++){g+=`<line x1=${x(d)} x2=${x(d)} y1=28 y2=76 stroke="currentColor" opacity=".06"/>`;if(k%2==0)g+=`<text x=${x(d)} y=92 text-anchor="middle">${new Date(d+8*36e5).toISOString().slice(5,10)}</text>`}
