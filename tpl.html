<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tibo Reset 追踪 · Codex/ChatGPT 额度重置</title>
<style>
:root{--bg:#eef1f8;--fg:#141724;--mut:#5d6578;--glass:rgba(255,255,255,.62);--bd:rgba(20,30,60,.10);--acc:#6d5efc;--acc2:#00b4d8;--ok:#0fb981;--warn:#e08a00;--sh:0 10px 30px rgba(40,50,90,.10)}
@media(prefers-color-scheme:dark){:root{--bg:#07080d;--fg:#e9ecf5;--mut:#9aa3b8;--glass:rgba(24,28,42,.55);--bd:rgba(255,255,255,.08);--acc:#9b8cff;--acc2:#3fd5f5;--ok:#34d399;--warn:#fbbf24;--sh:0 10px 40px rgba(0,0,0,.45)}}
*{box-sizing:border-box}html,body{margin:0}
body{font:14px/1.6 -apple-system,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;color:var(--fg);background:var(--bg);min-height:100vh;overflow-x:hidden}
body:before{content:"";position:fixed;inset:-20%;z-index:-1;background:radial-gradient(40% 35% at 15% 10%,color-mix(in srgb,var(--acc) 30%,transparent),transparent 70%),radial-gradient(35% 30% at 90% 20%,color-mix(in srgb,var(--acc2) 25%,transparent),transparent 70%),radial-gradient(40% 40% at 60% 95%,color-mix(in srgb,var(--ok) 15%,transparent),transparent 70%)}
.w{max-width:1200px;margin:auto;padding:28px 20px 40px}
.top{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
h1{font-size:28px;margin:0;letter-spacing:-.02em}h1 b{background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:15px;margin:0 0 12px;display:flex;gap:8px;align-items:center}
.sub,.q{color:var(--mut)}.q{font-size:12px}
.bento{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.c{position:relative;grid-column:span 12;background:var(--glass);border:1px solid var(--bd);border-radius:22px;padding:20px 22px;backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);box-shadow:var(--sh);transform:perspective(900px) rotateX(var(--rx,0)) rotateY(var(--ry,0)) translate(var(--tx,0),var(--ty,0));transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s;overflow:hidden;min-width:0}
.c:after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .25s;background:radial-gradient(320px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--acc) 22%,transparent),transparent 60%)}
.c:hover:after{opacity:1}.c:hover{box-shadow:var(--sh),0 0 0 1px color-mix(in srgb,var(--acc) 40%,transparent),0 0 40px color-mix(in srgb,var(--acc) 18%,transparent)}
.s8{grid-column:span 8}.s4{grid-column:span 4}.s3{grid-column:span 3}.s6{grid-column:span 6}
@media(max-width:900px){.s8,.s4,.s6{grid-column:span 12}.s3{grid-column:span 6}}
@media(max-width:520px){.s3{grid-column:span 12}.w{padding:18px 12px}h1{font-size:23px}}
.hero{background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 22%,var(--glass)),color-mix(in srgb,var(--acc2) 14%,var(--glass)))}
.big{font-size:clamp(24px,4vw,40px);font-weight:800;letter-spacing:-.02em;line-height:1.15;margin:6px 0 10px}
.grad{background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.k{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.06em}.v{font-size:24px;font-weight:750}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent)}
.pill{display:inline-flex;gap:6px;align-items:center;padding:4px 12px;border-radius:99px;background:var(--glass);border:1px solid var(--bd);font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok)}
.bar{height:8px;border-radius:9px;background:color-mix(in srgb,var(--fg) 10%,transparent);overflow:hidden;margin:10px 0 4px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:9px}
.hl{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px}.hl>div{min-width:130px}
a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}
.u{color:var(--mut);font-style:italic;opacity:.85}
.tl{max-height:640px;overflow:auto;margin:0 -6px;padding:0 6px}
.ev{display:grid;grid-template-columns:150px 1fr 1fr 110px;gap:12px;padding:12px;border-radius:14px;border:1px solid var(--bd);margin-bottom:8px;background:color-mix(in srgb,var(--glass) 60%,transparent)}
.ev.ch{border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
@media(max-width:760px){.ev{grid-template-columns:1fr 1fr}.ev>.d{grid-column:span 2}}
.ev .t{font-weight:700}.lab{font-size:11px;color:var(--mut)}
.chip{display:inline-block;font-size:11px;padding:0 7px;border-radius:99px;background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok);margin-left:4px}
svg text{fill:var(--mut);font-size:10px}ul{margin:4px 0;padding-left:18px}li{margin:3px 0}
.bk{display:flex;flex-direction:column;gap:8px;max-height:340px;overflow:auto}.bk div{font-size:12.5px;padding:8px 10px;border-radius:10px;border:1px solid var(--bd)}
.flt{display:flex;gap:6px;flex-wrap:wrap}.flt button{font:inherit;font-size:12px;padding:3px 12px;border-radius:99px;border:1px solid var(--bd);background:var(--glass);color:var(--fg);cursor:pointer}.flt button.on{background:var(--acc);color:#fff;border-color:transparent}

.nav{position:sticky;top:10px;z-index:50;display:flex;gap:6px;padding:6px;margin:0 0 18px;border-radius:99px;background:var(--glass);border:1px solid var(--bd);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);box-shadow:var(--sh);overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{flex:0 0 auto;padding:7px 16px;border-radius:99px;color:var(--fg);font-weight:600;font-size:13px;text-decoration:none;transition:background .2s,color .2s}
.nav a:hover{background:color-mix(in srgb,var(--acc) 12%,transparent);text-decoration:none}
.nav a.on{background:linear-gradient(90deg,var(--acc),var(--acc2));color:#fff;box-shadow:0 0 18px color-mix(in srgb,var(--acc) 45%,transparent)}
@media(max-width:600px){.nav{position:fixed;top:auto;bottom:10px;left:10px;right:10px;margin:0}.w{padding-bottom:84px}}
[data-tab]{display:none}[data-tab].show{display:block;animation:tin .32s ease both}.bento>[data-tab].show{display:block}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.more{display:inline-block;margin-top:10px;font-size:12px;font-weight:600}
.foot{margin-top:18px;text-align:center}
@media(prefers-reduced-motion:reduce){[data-tab].show{animation:none}.c{transition:none!important;transform:none!important}.c:after{display:none}}
</style></head><body><div class="w">
<div class="top"><div><h1>🔄 <b>Tibo Reset</b> 追踪</h1><div class="sub">Codex / ChatGPT Work 全局额度重置（@thsottiaux 官宣）· 时间均为北京时间 UTC+8</div></div><span class="pill"><span class="dot"></span>生成于 <span id="gen"></span></span></div>
<nav class="nav" aria-label="分类"><a href="#overview">✨ 概览</a><a href="#forecast">🧭 预测依据</a><a href="#trend">📈 趋势</a><a href="#history">🗂 历史记录</a><a href="#other">📎 其他</a></nav>
<main class="bento">
 <section data-tab="overview" class="c hero s8 mag" id="hero"></section>
 <section data-tab="overview" class="c s4 mag" id="status"></section>
 <div data-tab="overview" class="s3 c mag kpi" id="k1"></div><div data-tab="overview" class="s3 c mag kpi" id="k2"></div><div data-tab="overview" class="s3 c mag kpi" id="k3"></div><div data-tab="overview" class="s3 c mag kpi" id="k4"></div>
 <section data-tab="forecast" class="c s8 mag" id="basis"></section>
 <section data-tab="forecast" class="c s4 mag" id="lag"></section>
 <section data-tab="trend" class="c mag"><h2>📈 重置间隔趋势（天）</h2><div id="chart"></div><div class="q">柱 = 与上一次全局重置的间隔（近 40 次）；虚线 = 近 30 天中位数；<span style="color:var(--ok)">绿色</span> = 28 天挑战期内；超过 20 天的柱被截断。banked reset 不计入。</div></section>
 <section data-tab="history" class="c"><h2>🗂 历史记录 <span class="q" id="cnt"></span></h2>
  <div class="flt" style="margin-bottom:12px"><button class="on" data-f="all">全部</button><button data-f="ch">有预告帖</button><button data-f="win">有官方窗口</button></div>
  <div class="tl" id="tb"></div></section>
 <section data-tab="other" class="c s6 mag"><h2>🏦 Banked reset 记录 <span class="q">（不计入间隔）</span></h2><div class="bk" id="bk"></div></section>
 <section data-tab="other" class="c s6 mag"><h2>⚠️ 数据缺口</h2><ul id="gaps"></ul></section>
 <section data-tab="other" class="c q mag" id="ft"></section>
</main><footer class="foot q" id="sf"></footer></div>
<script>
const D=__DATA__;const $=s=>document.querySelector(s);const U='<span class="u">unknown</span>';const L=D.last_reset,F=D.forecast,S=D.stats_30d,A=D.stats_all;
const lk=(u,t)=>`<a href="${u}" target="_blank" rel="noopener">${t}</a>`;
$('#gen').textContent=D.generated_at_bj;
$('#hero').innerHTML=`<div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><div class="k">🔮 下次全局重置 · 预测窗口</div><span class="tag">估计，非官方 · 信心 ${F.confidence}</span></div>
<div class="big grad">${F.window_start_bj}<br>→ ${F.window_end_bj}</div>
<div class="q">${F.hour_note}</div><div class="q" style="margin-top:6px">⚡ 改判条件：${F.change}</div><a class="more" href="#forecast">查看预测依据 →</a>`;
const pct=Math.min(100,D.days_since_last/S.median*100);
$('#status').innerHTML=`<div class="k">● 当前状态</div><div class="q" style="margin-top:6px">最近一次全局重置</div><div class="v">${L.actual_bj}</div><div class="q">${L.label||''} · ${lk(L.teaser.url,'预告帖')} · ${lk(L.confirmation.url,'“'+L.confirmation.quote+'”')} · ${lk(L.radar_url,'Radar')}</div>
<div class="bar"><i style="width:${pct}%"></i></div><div class="q">已过 <b>${D.days_since_last.toFixed(1)} 天</b> / 近 30 天中位间隔 ${S.median} 天</div><a class="more" href="#trend">查看间隔趋势 →</a>`;
[['距上次重置',D.days_since_last.toFixed(1)+' 天','截至 '+D.generated_at_bj],['近30天中位间隔',S.median+' 天',`均值 ${S.mean} · 范围 ${S.min}–${S.max} · n=${S.n}`],['全历史中位间隔',A.median+' 天',`均值 ${A.mean} · 范围 ${A.min}–${A.max} · n=${A.n}`],['已收录',D.events.length+' 次','全局重置 + '+D.banked.length+' 条 banked']]
 .forEach(([k,v,s],i)=>$('#k'+(i+1)).innerHTML=`<div class="k">${k}</div><div class="v">${v}</div><div class="q">${s}</div>${i==3?'<a class="more" href="#history">查看历史记录 →</a> · <a class="more" href="#other">banked / 缺口 →</a>':''}`);
$('#basis').innerHTML=`<h2>🧭 预测依据 <span class="tag">估计</span></h2><p style="margin:0 0 8px">${F.basis}</p><div class="q">信息源：${lk(L.teaser.url,'Day 13 预告')} · ${lk(L.confirmation.url,'Day 13 “Done”')} · ${lk('https://codex-reset.com','Tibo Radar')} · ${lk('https://x.com/thsottiaux','@thsottiaux')}</div>`;
const lags=D.teaser_lag_hours_challenge,ml=Math.max(...lags);
$('#lag').innerHTML=`<h2>⏱ 挑战期 预告→落地</h2>${lags.map(h=>`<div class="q" style="display:flex;gap:8px;align-items:center"><span style="width:50px">${h} h</span><div class="bar" style="flex:1;margin:6px 0"><i style="width:${h/ml*100}%"></i></div></div>`).join('')}<div class="q">Day 2 / 6 / 8 / 10 / 13（按时间顺序）</div>`;
const fmt=h=>h==null?U:(h>0?'+':'')+h.toFixed(1)+' h';
function rows(f){const ev=[...D.events].reverse().filter(r=>f=='all'||(f=='ch'?r.teaser:r.window));$('#cnt').textContent=`显示 ${ev.length} / ${D.events.length}`;
$('#tb').innerHTML=ev.map(r=>`<div class="ev ${r.label&&r.label.startsWith('Day')?'ch':''}">
<div class="d"><div class="t">${r.actual_bj.slice(0,10)}${r.label?`<span class="chip">${r.label}</span>`:''}</div><div class="q">${lk(r.radar_url,r.radar_summary.slice(0,80)+'…')}</div></div>
<div><div class="lab">预测依据（信息源）</div>${r.teaser?`${lk(r.teaser.url,r.teaser.time_bj)}<div class="q">“${r.teaser.quote}”</div>`:''}<div class="q">${r.pred_note}</div><div class="lab" style="margin-top:4px">预测时间</div>${r.predicted_bj=='unknown'?U:r.predicted_bj}</div>
<div><div class="lab">实际时间</div>${r.actual_bj}<div class="q">${r.actual_basis}</div>${r.confirmation?`<div class="q">确认 ${lk(r.confirmation.url,r.confirmation.time_bj)}</div>`:''}${r.lag_teaser_h!=null?`<div class="q">预告后 ${r.lag_teaser_h} h</div>`:''}</div>
<div><div class="lab">偏差</div>${fmt(r.dev_h)}<div class="lab" style="margin-top:4px">间隔</div>${r.gap_days!=null?r.gap_days+' 天':'—'}</div></div>`).join('')}
rows('all');document.querySelectorAll('.flt button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.flt button').forEach(x=>x.classList.remove('on'));b.classList.add('on');rows(b.dataset.f)});
const g=D.events.filter(r=>r.gap_days!=null).slice(-40),W=1100,H=240,pl=30,pb=34,mx=Math.min(20,Math.max(...g.map(r=>r.gap_days))),bw=(W-pl)/g.length,y=v=>H-pb-(Math.min(v,mx)/mx)*(H-pb-10);
let s=`<svg viewBox="0 0 ${W} ${H}" width="100%"><defs><linearGradient id="gr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--acc2)"/><stop offset="1" stop-color="var(--acc)"/></linearGradient></defs>`;
[0,5,10,15,20].filter(t=>t<=mx).forEach(t=>s+=`<line x1=${pl} x2=${W} y1=${y(t)} y2=${y(t)} stroke="currentColor" opacity=".1"/><text x=0 y=${y(t)+3}>${t}</text>`);
g.forEach((r,i)=>{const x=pl+i*bw;s+=`<rect x=${x+2} y=${y(r.gap_days)} width=${bw-4} height=${H-pb-y(r.gap_days)} rx=4 fill="${r.label&&r.label.startsWith('Day')?'var(--ok)':'url(#gr)'}"><title>${r.actual_bj}：${r.gap_days} 天</title></rect>`;if(i%4==0||i==g.length-1)s+=`<text x=${x} y=${H-18}>${r.actual_bj.slice(5,10)}</text>`});
s+=`<line x1=${pl} x2=${W} y1=${y(S.median)} y2=${y(S.median)} stroke="var(--warn)" stroke-dasharray="5 4"/><text x=${W-130} y=${y(S.median)-4} style="fill:var(--warn)">30天中位 ${S.median}d</text></svg>`;
$('#chart').innerHTML=s;
$('#bk').innerHTML=D.banked.map(b=>`<div><b>${b.date_bj}</b> · ${b.summary}<br>${b.url?lk(b.url,'原帖'):'<span class="u">无 X 原帖（Radar 实测）</span>'}</div>`).join('');
$('#gaps').innerHTML=D.gaps.map(x=>`<li>${x}</li>`).join('');
$('#ft').innerHTML=`<h2>🔗 数据源与图例</h2>数据源：${D.sources.map(u=>lk(u,u)).join(' · ')}　|　共 ${D.events.length} 次全局重置（Radar 归档 + X 原帖核验）、${D.banked.length} 条 banked 记录　|　所有预测均为估计；unknown = 未能核实　|　生成于 ${D.generated_at_bj}（北京时间）`;
$('#sf').innerHTML=`生成于 ${D.generated_at_bj}（北京时间）· 预测均为估计，unknown = 未能核实 · <a href="#other">数据源</a>`;
const TABS=['overview','forecast','trend','history','other'];
function route(){let t=location.hash.slice(1);if(!TABS.includes(t))t='overview';
 document.querySelectorAll('[data-tab]').forEach(e=>e.classList.toggle('show',e.dataset.tab==t));
 document.querySelectorAll('.nav a').forEach(a=>{const on=a.getAttribute('href')=='#'+t;a.classList.toggle('on',on);on?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current');if(on)a.scrollIntoView({block:'nearest',inline:'nearest'})});
 window.scrollTo(0,0)}
addEventListener('hashchange',route);route();
// magnetic hover
const rm=matchMedia('(prefers-reduced-motion: reduce)'),fine=matchMedia('(pointer:fine)');
document.querySelectorAll('.c').forEach(c=>{c.addEventListener('pointermove',e=>{const r=c.getBoundingClientRect(),px=(e.clientX-r.left)/r.width,py=(e.clientY-r.top)/r.height;c.style.setProperty('--mx',px*100+'%');c.style.setProperty('--my',py*100+'%');
 if(rm.matches||!fine.matches||!c.classList.contains('mag'))return;const k=Math.min(1,600/r.width);c.style.setProperty('--ry',((px-.5)*6*k)+'deg');c.style.setProperty('--rx',((.5-py)*6*k)+'deg');c.style.setProperty('--tx',(px-.5)*6+'px');c.style.setProperty('--ty',(py-.5)*6+'px')});
 c.addEventListener('pointerleave',()=>['--rx','--ry','--tx','--ty'].forEach(p=>c.style.removeProperty(p)))});
</script></body></html>
